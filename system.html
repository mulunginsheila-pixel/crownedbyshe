<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Crowned by She</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2ea;--cd:#fff;--ink:#1a1814;--mu:#7a705f;--ln:#e8dfce;--go:#b8883c;--gs:#f1e6cc;--ok:#2f7a54;--bd:#b23a2c;--bl:#2c6a97;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 'DM Sans',system-ui,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
h1,h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;margin:0}h1{font-size:34px}h2{font-size:22px;margin:18px 0 8px}
main{max-width:720px;margin:auto;padding:12px 16px}.top button{background:#1d1a14;color:#f3ead6;border-color:#3a3427}.top{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.lg{font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;letter-spacing:2px;display:flex;gap:8px;align-items:center}
button,input,select,textarea{font:inherit;color:var(--ink)}input,select,textarea{width:100%;padding:11px;border:1px solid var(--ln);border-radius:12px;background:var(--cd);margin:3px 0 10px}
button{border:1px solid var(--ln);background:var(--cd);border-radius:12px;padding:10px 14px;font-weight:500;cursor:pointer}button.p{background:var(--go);border-color:var(--go);color:#fff}button.d{color:var(--bd);border-color:#e3b9b2}button.k{background:#161410;color:#f3ead6;border-color:#161410}
.q{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;margin:12px 0}.q button{padding:13px 6px}
.c{background:var(--cd);border:1px solid var(--ln);border-radius:18px;padding:14px;margin-bottom:12px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2 .c{margin:0}
.mu{color:var(--mu);font-size:13px}.big{font-family:'Cormorant Garamond',Georgia,serif;font-size:32px;line-height:1.1}.big small{font-family:'DM Sans',sans-serif;font-size:13px;color:var(--mu)}
.r{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln);align-items:center}.r:last-child{border:0}
.b{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--gs);color:#8a6a22;margin-right:4px}.b.ok{background:#e1f0e7;color:var(--ok)}.b.bl{background:#e0edf6;color:var(--bl)}.b.bd{background:#f8e3df;color:var(--bd)}
nav{position:fixed;left:0;right:0;bottom:0;background:#161410;display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}nav button{flex:1;background:none;border:0;color:#b5a88c;border-radius:0;padding:10px 2px;font-size:12px}nav button.on{color:#e0b957}nav i{display:block;font-style:normal;font-size:20px}
.ch{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}.ch button.on{background:#161410;color:#f3ead6}.ch button{border-radius:99px}
#sh{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:9}#sh>div{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;padding:18px;border-radius:22px 22px 0 0}
.cal{display:flex;overflow-x:auto;border:1px solid var(--ln);border-radius:16px;background:var(--cd)}.hr{width:44px;flex:none;font-size:11px;color:var(--mu)}.hr div,.col .h{height:60px}.col{min-width:150px;flex:1;border-left:1px solid var(--ln);position:relative}.col .hd{height:46px;padding:6px;font-weight:700;border-bottom:1px solid var(--ln);position:sticky;top:0}.ev{position:absolute;left:4px;right:4px;border-radius:10px;padding:5px 7px;font-size:12px;overflow:hidden;border-left:4px solid var(--go);background:var(--gs)}
.ev.chair{background:#e0edf6;border-color:var(--bl)}.ev.done{background:#eceae4;border-color:#aaa;color:#555}.ev.held{background:#fff;border:1px dashed var(--go)}.ev.noshow,.ev.cancelled{background:#f8e3df;border-color:var(--bd)}
.bar{height:10px;border-radius:9px;background:var(--gs);margin:3px 0 8px}.bar i{display:block;height:100%;border-radius:9px;background:var(--go)}.sc{overflow-x:auto}
.cm{display:flex;gap:6px;align-items:flex-end;height:120px}.cm div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.cm i{display:block;background:#dcc283;border-radius:7px 7px 0 0}
.hm{display:grid;grid-template-columns:34px repeat(11,1fr);gap:3px;font-size:10px;color:var(--mu)}.hm i{height:20px;border-radius:5px;background:var(--go)}
</style></head><body><main id="app"></main><nav id="nav"></nav><div id="sh" onclick="if(event.target==this)cl()"></div>

 const a={id:nid(),c:c.id,s:sy.id,v:v.id,d:p.date,t:p.time,st:'held',pays:[],online:String(p.ref||'online')};S.ap.push(a);R.d=a.d;lg('Online booking added: '+c.n);ackInbox(id,'done');R.tab='cal';done()}

function ordOk(id){const x=INB.find(z=>z.id==id);if(!x)return cl();const p=x.payload||{},m=gv('m')||'MTN MoMo',by=$('#ob').value;let n=0;

function shrink(f,mx){mx=mx||900;return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(),'image/jpeg',.82);URL.revokeObjectURL(u)};im.onerror=rej;im.src=u})}

const tsd=i=>{const x=g('shp',i);x.sold=x.sold?0:1;lg((x.sold?'Marked sold out: ':'Back in stock: ')+x.n);done()},dlp=i=>{if(confirm('Remove this product from your shop?')){lg('Removed shop product '+g('shp',i).n);S.shp=S.shp.filter(x=>x.id!=i);done()}};

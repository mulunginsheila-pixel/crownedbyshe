<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Crowned by She — Book & Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2ea;--cd:#fff;--ink:#1a1814;--mu:#7a705f;--ln:#e8dfce;--go:#b8883c;--gs:#f1e6cc;--ok:#2f7a54;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 'DM Sans',system-ui,sans-serif;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
h1,h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;margin:0}h1{font-size:32px;margin:14px 0 10px}h2{font-size:22px;margin:16px 0 8px}
header{text-align:center;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 0}header img{height:96px;mix-blend-mode:multiply}
.tabs{display:flex;gap:8px;max-width:640px;margin:8px auto 0;padding:8px 16px;position:sticky;top:0;background:var(--bg);z-index:5}
.tabs button{flex:1;padding:12px;border-radius:99px;font-weight:700}.tabs button.on{background:#161410;color:#f3ead6;border-color:#161410}
main{max-width:640px;margin:auto;padding:4px 16px}
button,input,select,textarea,.btn{font:inherit;color:var(--ink)}input,select,textarea{width:100%;padding:12px;border:1px solid var(--ln);border-radius:12px;background:var(--cd);margin:3px 0 10px}
button,.btn{border:1px solid var(--ln);background:var(--cd);border-radius:12px;padding:10px 14px;font-weight:500;cursor:pointer;display:inline-block;text-decoration:none;text-align:center}button.p,.btn.p{background:var(--go);border-color:var(--go);color:#fff;font-weight:700}.btn.w{display:block;width:100%;padding:15px;margin-bottom:8px}
.c{background:var(--cd);border:1px solid var(--ln);border-radius:18px;padding:14px;margin-bottom:10px}.mu{color:var(--mu);font-size:13px}
.r{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}.r:last-child{border:0}
.sv{cursor:pointer}.cat{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--mu);margin:16px 0 6px}
.ch{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}.ch.s{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.ch button{border-radius:99px;white-space:nowrap}.ch button.on{background:#161410;color:#f3ead6}
.bar{display:flex;gap:6px;margin:6px 0 4px}.bar i{flex:1;height:4px;border-radius:4px;background:var(--ln)}.bar i.on{background:var(--go)}
.note{background:var(--gs);border-radius:14px;padding:12px;margin:8px 0 12px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pc{background:var(--cd);border:1px solid var(--ln);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.im{position:relative;aspect-ratio:1;overflow:hidden;background:linear-gradient(135deg,#f1e6cc,#e3cf9f);display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--go)}.im img{width:100%;height:100%;object-fit:cover}
.so{position:absolute;top:12px;left:-32px;background:#1a1814;color:#f3ead6;font-size:11px;font-weight:700;letter-spacing:1px;padding:4px 40px;transform:rotate(-35deg)}.im.sd img{opacity:.45}.im.sd{filter:grayscale(.6)}button[disabled]{opacity:.6;cursor:not-allowed}
.pb{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}.pb b{font-size:14px}.pb button{margin-top:auto}
.cb{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:616px;margin:auto;z-index:6}.cb button{width:100%;padding:15px;box-shadow:0 6px 18px #0003}
.q{display:flex;align-items:center;gap:10px}.q button{width:34px;height:34px;padding:0;border-radius:99px}
</style></head><body>

function nav(){$('#tabs').innerHTML='<button class="'+(T.tab=='book'?'on':'')+'" onclick="T.tab=\'book\';render()">Book</button><button class="'+(T.tab=='shop'?'on':'')+'" onclick="T.tab=\'shop\';T.view=\'list\';render()">Shop</button>'}
function render(){nav();$('#app').innerHTML=!T.loaded?'<div class="c" style="text-align:center;margin-top:20px"><p class="mu" style="margin:6px">Loading…</p></div>':(T.tab=='book'?book():shop());window.scrollTo(0,0)}
const offline=()=>!T.ok?'<div class="note"><b>We could not load our latest menu.</b><br>Check your internet connection and <a href="#" onclick="loadLive();return false">try again</a>'+(waUrl('Hi Crowned by She!')?', or <a href="'+E(waUrl('Hi Crowned by She!'))+'" target="_blank">message us on WhatsApp</a>':'')+'.</div>':'';
function book(){if(!T.ok||!SERVICES.length)return offline()+(T.ok?'<div class="c"><b>Online booking is not open yet.</b><p class="mu">Please message us on WhatsApp to book.</p>'+(waUrl('Hi Crowned by She! I would like to book an appointment.')?'<a class="btn p w" target="_blank" href="'+E(waUrl('Hi Crowned by She! I would like to book an appointment.'))+'">Message us on WhatsApp</a>':'')+'</div>':'');
const s=T.step,bar='<div class="bar">'+[1,2,3,4].map(i=>'<i class="'+(i<=Math.min(s,4)?'on':'')+'"></i>').join('')+'</div>',back=s>1&&s<5?'<button onclick="T.step--;render()">‹ Back</button>':'';let b='';
if(s==1){let c='';b='<h1>What would you like done?</h1>'+SERVICES.map((x,i)=>(x[0]!=c?'<div class="cat">'+E((c=x[0]).toUpperCase())+'</div>':'')+'<div class="c sv" onclick="T.v='+i+';T.step=2;render()"><div class="r" style="border:0;padding:0"><span><b>'+E(x[1])+'</b><div class="mu">'+(x[3]>=60?Math.floor(x[3]/60)+'h'+(x[3]%60?' '+x[3]%60+'m':''):x[3]+' min')+'</div></span><b>'+U(x[2])+'</b></div></div>').join('')}
if(s==2)b='<h1>Who would you like?</h1><div class="c sv" onclick="T.y=\'Any available stylist\';T.step=3;render()"><b>Any available stylist</b><div class="mu">Shows the most times</div></div>'+STYLISTS.map((x,i)=>'<div class="c sv" onclick="T.y=STYLISTS['+i+'][0];T.step=3;render()"><b>'+E(x[0])+'</b><div class="mu">'+E(x[1])+'</div></div>').join('');
if(s==3){const t=[];for(let m=540;m<=1050;m+=30)t.push(m);b='<h1>Pick a day and time</h1><div class="ch s">'+[...Array(14)].map((_,i)=>'<button class="'+(dO(i)==T.d?'on':'')+'" onclick="T.d=\''+dO(i)+'\';render()">'+(i?fd(dO(i)).replace(',',''):'Today')+'</button>').join('')+'</div><div class="ch">'+t.map(m=>'<button onclick="T.t='+m+';T.step=4;render()">'+f12(m)+'</button>').join('')+'</div><p class="mu">We confirm your time with you, and suggest another if it is taken.</p>'}
if(s==4){const x=SERVICES[T.v];b='<h1>Your details</h1><div class="c"><div class="r"><span>'+E(x[1])+'</span><b>'+U(x[2])+'</b></div><div class="r"><span>With</span><b>'+E(T.y)+'</b></div><div class="r"><span>When</span><b>'+fd(T.d)+', '+f12(T.t)+' – '+f12(T.t+x[3])+'</b></div></div><label class="mu">Your name</label><input id="fn" placeholder="First and last name" value="'+E(T.f.n)+'"><label class="mu">WhatsApp number</label><input id="fp" inputmode="tel" placeholder="07…" value="'+E(T.f.p)+'"><label class="mu">Anything we should know? (optional)</label><input id="fx" placeholder="Allergies, hair length, inspiration…" value="'+E(T.f.x)+'"><div class="note">A <b>UGX '+U(SITE.dep)+' deposit</b> confirms your booking and is deducted from your final bill. Cancel at least '+SITE.win+' hours before and your deposit is kept as credit for your next booking. Later than that, or a no-show, the deposit is not refunded.</div><button class="p" id="sb" style="width:100%;padding:15px" onclick="sendBook()">Request booking</button>'}
if(s==5){const x=SERVICES[T.v]||[],m='Hi Crowned by She! I just requested a booking (ref '+T.ref+'):\n• '+x[1]+'\n• With: '+T.y+'\n• '+fd(T.d)+', '+f12(T.t)+'\n• Name: '+T.nm+'\nPlease confirm. I will send the UGX '+U(SITE.dep)+' deposit.',u=waUrl(m);
 b='<div style="text-align:center;font-size:44px;color:var(--ok)">✓</div><h1 style="text-align:center">'+(T.saved?'Request received':'Almost done')+', '+E(T.first)+'</h1><p class="mu" style="text-align:center">Reference <b>'+E(T.ref)+'</b>. '+(T.saved?'We will confirm your time with you shortly.':'We could not save it online, so please send it to us on WhatsApp below.')+'</p>'+(u?'<a class="btn p w" target="_blank" href="'+E(u)+'">Send us a WhatsApp to confirm faster</a>':'')+'<div class="c"><b>Pay the UGX '+U(SITE.dep)+' deposit to confirm</b>'+pay()+'</div><button style="width:100%" onclick="T.step=1;T.f={};render()">Book another</button>'}
return offline()+bar+back+b}
const pay=()=>((SITE.momo?'<div class="r"><span>MTN MoMo</span><b>'+E(SITE.momo)+'</b></div>':'')+(SITE.airtel?'<div class="r"><span>Airtel Pay</span><b>'+E(SITE.airtel)+'</b></div>':'')+((SITE.momo||SITE.airtel)?'<div class="r"><span>Name</span><b>'+E(SITE.pn)+'</b></div>':'<p class="mu">We will send you the payment details.</p>')+'<p class="mu">You can also pay cash or card at the salon.</p>');
async function sendBook(){if(T.busy)return;keep();if(!T.f.n)return alert('Please enter your name');if(!T.f.p)return alert('Please enter your WhatsApp number');const x=SERVICES[T.v],ref='B'+Math.random().toString(36).slice(2,6).toUpperCase();T.busy=1;const bt=$('#sb');if(bt){bt.disabled=true;bt.textContent='Sending…'}
 const ok=await submit('booking',{ref,name:T.f.n,phone:T.f.p,svc:x[1],sty:T.y,date:T.d,time:hmm(T.t),notes:T.f.x||'',price:x[2],mins:x[3]});T.busy=0;
 if(!ok&&!waN(SITE.wa)){if(bt){bt.disabled=false;bt.textContent='Request booking'}return alert('Sorry, we could not send your request. Please check your internet and try again.')}
 T.ref=ref;T.saved=ok;T.nm=T.f.n;T.first=T.f.n.split(' ')[0];T.step=5;render()}
const sold=p=>/sold/i.test(String(p[4]||'')),cnt=()=>Object.values(T.cart).reduce((a,b)=>a+b,0),tot=()=>Object.entries(T.cart).reduce((s,[i,q])=>s+PRODUCTS[i][2]*q,0),add=(i,d)=>{T.cart[i]=Math.max(0,(T.cart[i]||0)+d);if(!T.cart[i])delete T.cart[i];render()};
function shop(){if(!T.ok)return offline();if(T.view=='done')return done();if(!PRODUCTS.length)return'<h1>Shop</h1><div class="c"><b>Products are coming soon.</b><p class="mu">Message us on WhatsApp to order.</p>'+(waUrl('Hi Crowned by She! I would like to order.')?'<a class="btn p w" target="_blank" href="'+E(waUrl('Hi Crowned by She! I would like to order.'))+'">Message us on WhatsApp</a>':'')+'</div>';if(T.view=='cart')return cart();
const cats=['All',...new Set(PRODUCTS.map(p=>p[0]))];return'<h1>Shop</h1><p class="mu" style="margin-top:-6px">Wigs, bundles, hair products and more. Place your order here and we will confirm it with you.</p><div class="ch s">'+cats.map(c=>'<button class="'+(T.cat==c?'on':'')+'" onclick="T.cat=\''+E(c)+'\';render()">'+E(c)+'</button>').join('')+'</div><div class="g">'+PRODUCTS.map((p,i)=>T.cat=='All'||p[0]==T.cat?'<div class="pc"><div class="im'+(sold(p)?' sd':'')+'">'+(sold(p)?'<div class="so">SOLD OUT</div>':'')+(p[3]?'<img loading="lazy" src="'+E(p[3])+'" alt="'+E(p[1])+'">':'♛')+'</div><div class="pb"><span class="mu">'+E(p[0])+'</span><b>'+E(p[1])+'</b><b style="color:var(--go)">UGX '+U(p[2])+'</b>'+(sold(p)?'<button disabled>Sold out</button>':T.cart[i]?'<div class="q"><button onclick="add('+i+',-1)">−</button><b>'+T.cart[i]+'</b><button onclick="add('+i+',1)">+</button></div>':'<button class="p" onclick="add('+i+',1)">Add to cart</button>')+'</div></div>':'').join('')+'</div>'+(cnt()?'<div class="cb"><button class="p" onclick="T.view=\'cart\';render()">View cart ('+cnt()+') · UGX '+U(tot())+'</button></div>':'')}
function cart(){const ids=Object.keys(T.cart);if(!ids.length)return'<button onclick="T.view=\'list\';render()">‹ Back to shop</button><h1>Your cart</h1><p class="mu">Your cart is empty.</p>';const d=T.deliv=='delivery';
return'<button onclick="keep();T.view=\'list\';render()">‹ Keep shopping</button><h1>Your cart</h1><div class="c">'+ids.map(i=>'<div class="r"><span><b>'+E(PRODUCTS[i][1])+'</b><div class="mu">UGX '+U(PRODUCTS[i][2])+' each</div></span><span class="q"><button onclick="keep();add('+i+',-1)">−</button><b>'+T.cart[i]+'</b><button onclick="keep();add('+i+',1)">+</button></span></div>').join('')+'<div class="r"><b>Total</b><b>UGX '+U(tot())+'</b></div></div><label class="mu">Your name</label><input id="fn" value="'+E(T.f.n)+'"><label class="mu">WhatsApp number</label><input id="fp" inputmode="tel" placeholder="07…" value="'+E(T.f.p)+'"><label class="mu">Pick up or delivery?</label><select id="fd" onchange="keep();T.deliv=this.value;render()"><option value="pickup"'+(d?'':' selected')+'>Pick up at the salon</option><option value="delivery"'+(d?' selected':'')+'>Delivery (we confirm the fee)</option></select>'+(d?'<label class="mu">Delivery address / location</label><input id="fa" value="'+E(T.f.a)+'">':'')+'<div class="note">We confirm your order and total with you, then you pay by mobile money, cash or card when you collect.</div><button class="p" id="so" style="width:100%;padding:15px" onclick="sendOrder()">Place order</button>'}
async function sendOrder(){if(T.busy)return;keep();if(!T.f.n||!T.f.p)return alert('Please enter your name and WhatsApp number');if(T.deliv=='delivery'&&!T.f.a)return alert('Please enter your delivery address');
 const items=Object.entries(T.cart).map(([i,q])=>({n:PRODUCTS[i][1],q,p:PRODUCTS[i][2]})),total=tot(),ref='O'+Math.random().toString(36).slice(2,6).toUpperCase();T.busy=1;const bt=$('#so');if(bt){bt.disabled=true;bt.textContent='Sending…'}
 const ok=await submit('order',{ref,name:T.f.n,phone:T.f.p,items,total,deliv:T.deliv,addr:T.deliv=='delivery'?T.f.a:''});T.busy=0;
 if(!ok&&!waN(SITE.wa)){if(bt){bt.disabled=false;bt.textContent='Place order'}return alert('Sorry, we could not send your order. Please check your internet and try again.')}
 const m='Hi Crowned by She! I just placed an order (ref '+ref+'):\n\n'+items.map(x=>'• '+x.n+' × '+x.q+' = UGX '+U(x.p*x.q)).join('\n')+'\n\nTotal: UGX '+U(total)+'\n'+(T.deliv=='delivery'?'Delivery to: '+T.f.a:'Pick up at the salon')+'\nName: '+T.f.n+'\nPlease confirm availability and how to pay.';
 T.order={ref,saved:ok,url:waUrl(m),total,first:T.f.n.split(' ')[0]};T.cart={};T.view='done';render()}
function done(){const o=T.order||{};return'<div style="text-align:center;font-size:44px;color:var(--ok);margin-top:10px">✓</div><h1 style="text-align:center">'+(o.saved?'Order received':'Almost done')+', '+E(o.first)+'</h1><p class="mu" style="text-align:center">Reference <b>'+E(o.ref)+'</b> · Total UGX '+U(o.total)+'. '+(o.saved?'We will confirm your order and how to pay shortly.':'We could not save it online, so please send it to us on WhatsApp below.')+'</p>'+(o.url?'<a class="btn p w" target="_blank" href="'+E(o.url)+'">Send us a WhatsApp to confirm faster</a>':'')+((SITE.momo||SITE.airtel)?'<div class="c"><b>Payment details</b>'+pay()+'</div>':'')+'<button style="width:100%" onclick="T.view=\'list\';render()">Back to shop</button>'}
loadLive();
</script></body></html>
